<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Vực Quản Trị Hệ Thống | Admin Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .admin-card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            border: 1px solid #334155;
        }
        h1 { color: #10b981; font-size: 28px; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; }
        .user-tag {
            background-color: #064e3b;
            color: #6ee7b7;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="admin-card">
        <h1>Xác Thực Thành Công!</h1>
        <p>Chào mừng <span class="user-tag">admin_user</span> đến với Trung tâm Quản trị Hệ thống.</p>
        <p>HTTP Basic Authentication hoạt động chính xác.</p>
    </div>
</body>
</html>
